[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-research-mcp"
version = "0.1.0"
description = "Self-hosted MCP server using TypeSafe JEV as a semantic evidence-selection layer for coding-agent web research."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "JEV Research MCP Contributors" }]
keywords = ["mcp", "jev", "typesafe", "research", "evidence", "coding-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "typesafe-sdk>=0.7.0",
  "mcp>=1.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
  "mypy>=1.10",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
jev-research-mcp = "jev_research_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_research_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/jev_research_mcp/ui/index.html" = "jev_research_mcp/ui/index.html"

[tool.hatch.build.targets.sdist]
exclude = [".env", ".venv", "venv", "__pycache__", "*.pyc", ".pytest_cache", "benchmark_outputs", "logs"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF100"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["jev_research_mcp"]
